<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Livraison Libre - banc de test UI</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Segoe UI, Arial, sans-serif; }
  body { background: linear-gradient(160deg, #5d6b78 0%, #8a8f84 45%, #3d4247 100%); display: flex; gap: 16px; padding: 16px; box-sizing: border-box; }
  #app { width: 400px; height: 640px; position: relative; flex: 0 0 auto; }
  #ctrl { color: #fff; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
  #ctrl button { padding: 6px 10px; cursor: pointer; }
  #log { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 11px; background: rgba(0,0,0,0.5); padding: 8px; max-width: 480px; max-height: 300px; overflow: auto; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.5.8/angular.min.js"></script>
</head>
<body>
<div id="wrap" style="display:flex;gap:16px"><div id="app"><livraison-libre></livraison-libre></div><div id="resume" style="width:460px;height:330px;position:relative"><livraison-libre-resume></livraison-libre-resume></div></div>
<div id="ctrl">
  <b>Scénarios</b>
  <button onclick="H.scenario('idle')">Repos</button>
  <button onclick="H.scenario('prep')">Préparation</button>
  <button onclick="H.scenario('far')">En route (loin)</button>
  <button onclick="H.scenario('near')">Proche de la zone</button>
  <button onclick="H.scenario('inzone')">Dans la zone (sans frein)</button>
  <button onclick="H.scenario('validating')">Validation</button>
  <button onclick="H.scenario('timelimit')">Temps limite critique</button>
  <button onclick="H.scenario('summary')">Livrée</button>
  <button onclick="H.scenario('failed')">Ratée</button>
  <button onclick="H.scenario('lost')">Véhicule perdu</button>
  <button onclick="H.toast()">Toast erreur</button>
  <button onclick="H.summary(true)">Résumé réussi</button>
  <button onclick="H.summary(false)">Résumé raté</button>
  <button onclick="H.scenario('pursuit')">Poursuite</button>
  <div id="log"></div>
</div>
<script>
// ----- mock bngApi -----
window.H = {}
const registry = []
const calls = []
window.bngApi = {
  serializeToLua: function (v) { registry.push(v); return '__ARG' + (registry.length - 1) + '__' },
  engineLua: function (cmd, cb) {
    calls.push(cmd)
    const m = cmd.match(/livraisonLibre\.(\w+)\(([^)]*)\)/g) || []
    m.forEach(function (c) {
      const mm = c.match(/livraisonLibre\.(\w+)\(([^)]*)\)/)
      const fn = mm[1]
      const args = (mm[2].match(/__ARG(\d+)__/g) || []).map(function (t) { return registry[+t.match(/\d+/)[0]] })
      setTimeout(function () { H.handle(fn, args) }, 10)
    })
    document.getElementById('log').textContent = calls.slice(-14).join('\n')
    if (cb) setTimeout(function () { cb(null) }, 5)
  }
}

angular.module('beamng.apps', [])
  .filter('translate', function () {
    const dict = { 'levels.west_coast_usa.gasStationPoints.apex.title': 'Station Apex' }
    return function (k) { return dict[k] || k }
  })

const meta = {
  categories: [
    {id: 'citadine', label: 'Citadines & compactes'}, {id: 'berline', label: 'Berlines'}, {id: 'familiale', label: 'Breaks & monospaces'},
    {id: 'coupe', label: 'Coupés & cabriolets'}, {id: 'sport', label: 'Sportives'}, {id: 'suv', label: 'SUV & 4x4'}, {id: 'pickup', label: 'Pick-up'},
    {id: 'utilitaire', label: 'Utilitaires'}, {id: 'camion', label: 'Camions'}, {id: 'bus', label: 'Bus'}, {id: 'toutterrain', label: 'Buggy & tout-terrain'},
    {id: 'engin', label: 'Engins de chantier'}, {id: 'autre', label: 'Autres'}],
  epochs: [{id: 'ancienne', label: 'Anciennes (< 1980)'}, {id: 'retro', label: 'Années 80-90'}, {id: 'moderne', label: 'Modernes (2000+)'}, {id: 'inconnue', label: 'Année inconnue'}],
  variants: [{id: 'usine', label: 'Série'}, {id: 'custom', label: 'Préparées / custom'}, {id: 'course', label: 'Course, rallye & drift'}, {id: 'police', label: 'Police'}, {id: 'service', label: 'Services & secours'}],
  sources: [{id: 'officiel', label: 'Officiels BeamNG'}, {id: 'mod', label: 'Mods'}, {id: 'perso', label: 'Mes configs'}],
  transmissions: [{id: 'both', label: 'Les deux'}, {id: 'auto', label: 'Automatique'}, {id: 'manual', label: 'Manuelle'}],
  timeLevels: [{id: 'tres_facile', label: 'Très facile'}, {id: 'facile', label: 'Facile'}, {id: 'moyen', label: 'Moyen'}, {id: 'dur', label: 'Difficile'}, {id: 'tres_dur', label: 'Très difficile'}, {id: 'impossible', label: 'Impossible'}],
}
let settings = {
  version: 1, locMode: 'random', locKinds: {road: true, parking: true, poi: true, home: true}, surface: 'paved',
  minDist: 600, maxDist: 3500, avoidHighways: true, pavedThreshold: 0.7, zoneScale: 1.3, validation: 'handbrake',
  firstStartHere: false, keepOwnVehicle: false, fade: true, timeLimit: false, avgSpeedKmh: 45, timeBonus: 60,
  randomPaint: true, autoNext: true, instantNext: false, summaryDuration: 5, showCenterPost: true, showBeam: true, showArrow: true, ffbGuard: true, hidePoi: true, timeLimit: true, timeLevel: 'dur',
  traffic: {mode: 'on', amount: 12, parked: 6, police: 'wanted', strictness: 0.5, wantedLevel: 2, policeRatio: 0.25, arrestFails: true, removeOnStop: true, civiliansIgnoreSirens: true, policeNoSiren: false, clearPoliceNearEnd: true, progressive: true},
  ui: {tab: 'options', collapsed: false},
  veh: {cats: {citadine: true, berline: true, familiale: true, coupe: true, sport: true, suv: true, pickup: true, utilitaire: true, camion: false, bus: false, toutterrain: false, engin: false, autre: true},
        epochs: {ancienne: true, retro: true, moderne: true, inconnue: true},
        variants: {usine: true, custom: true, course: false, police: false, service: false},
        sources: {officiel: true, mod: true, perso: false}, transmission: 'both', blacklist: []}
}
let stats = {delivered: 12, failed: 2, skipped: 1, distance: 48200, time: 4210, bestAvg: 71.4, fastest: {time: 95, dist: 1200}, longest: 6800, streak: 3, bestStreak: 7,
  history: [
    {ok: true, vehicle: 'ETK 800 Series 856x (A)', from: 'Parking', to: 'levels.west_coast_usa.gasStationPoints.apex.title', dist: 2340, time: 182, avg: 46.3, level: 'west_coast_usa', date: '04/10 10:12'},
    {ok: false, vehicle: 'Gavril D-Series D25', from: 'Bord de route', to: 'Résidence', dist: 4100, time: 260, avg: 0, level: 'west_coast_usa', date: '04/10 09:58'},
    {ok: true, vehicle: 'Hirochi Sunburst 2.0 Sport', from: 'Résidence', to: 'Parking', dist: 980, time: 88, avg: 40.1, level: 'italy', date: '03/10 21:40'}]}
let points = [{id: 1, name: 'Maison', dist: 340}, {id: 2, name: 'Garage Belasco', dist: 2210}, {id: 3, name: 'Port', dist: 5410}]
let session = null
let levelReady = false
const vehModels = [
  {key: 'etk800', name: 'ETK 800-Series', brand: 'ETK', srcKind: 'officiel', configs: 52, eligible: 40, preview: '/x.jpg'},
  {key: 'pickup', name: 'D-Series', brand: 'Gavril', srcKind: 'officiel', configs: 74, eligible: 60},
  {key: 'covet', name: 'Covet', brand: 'Ibishu', srcKind: 'officiel', configs: 31, eligible: 22},
  {key: 'RLA_350z', name: 'Nissan 350Z', brand: 'Nissan', srcKind: 'mod', configs: 12, eligible: 12},
  {key: 'us_semi', name: 'T-Series', brand: 'Gavril', srcKind: 'officiel', configs: 40, eligible: 0},
]
for (let i = 0; i < 60; i++) vehModels.push({key: 'mod' + i, name: 'Voiture de mod très longue ' + i, brand: 'Marque', srcKind: 'mod', configs: 3, eligible: 2})

function rs() { return angular.element(document.querySelector('#wrap')).injector().get('$rootScope') }
function send(name, data) { rs().$broadcast(name, JSON.parse(JSON.stringify(data))) }
function state() {
  return {version: '1.0.0', level: 'west_coast_usa', levelReady: levelReady, settings: settings, stats: stats, session: session,
    vehicles: {loaded: true, models: 111, configs: 3305, eligibleModels: 102, eligibleConfigs: 2926},
    map: levelReady ? {counts: {road: 4210, parking: 612, poi: 87, home: 231}, legalSide: 1} : null,
    points: points, meta: meta,
    traffic: {state: 'on', amount: 12, parked: 6, police: 3, active: true},
    journal: {count: 37, path: 'C:\Users\toi\AppData\Local\BeamNG\BeamNG.drive\current\settings\livraisonLibre\livraisons.csv'}}
}
function sendState() { send('LivraisonLibreState', state()) }
const vehicle = {name: 'ETK 800-Series 856x Sport (M)', brand: 'ETK', years: '2013-2018', preview: '/car.png', model: 'etk800', cat: 'familiale', variant: 'usine', trans: 'Manuelle'}
const baseSession = {count: 4, vehicle: vehicle, from: {kind: 'parking', kindLabel: 'Parking', label: 'Parking'}, to: {kind: 'poi', kindLabel: "Lieu d'intérêt", label: 'levels.west_coast_usa.gasStationPoints.apex.title'}, routeDist: 2340}

H.handle = function (fn, args) {
  if (fn === 'requestState') sendState()
  if (fn === 'requestMapInfo') { levelReady = true; sendState() }
  if (fn === 'setSettings') { settings = args[0]; sendState() }
  if (fn === 'start') H.scenario('far')
  if (fn === 'stop') H.scenario('idle')
  if (fn === 'requestVehicles') { send('LivraisonLibreVehicles', {models: vehModels}); sendState() }
  if (fn === 'setBlacklisted') { if (Array.isArray(settings.veh.blacklist)) settings.veh.blacklist = {}; if (args[1]) settings.veh.blacklist[args[0]] = true; else delete settings.veh.blacklist[args[0]]; sendState() }
  if (fn === 'addPoint') { points.push({id: points.length + 10, name: args[0] || ('Point ' + (points.length + 1)), dist: 2}); sendState(); send('LivraisonLibreToast', {kind: 'ok', msg: 'Point enregistré.'}) }
  if (fn === 'removePoint') { points = points.filter(function (p) { return p.id !== args[0] }); sendState() }
  if (fn === 'renamePoint') { points.forEach(function (p) { if (p.id === args[0]) p.name = args[1] }); sendState() }
  if (fn === 'setUiPrefs') { settings.ui = args[0] }
  if (fn === 'previewSummary') H.summary(true, true)
  if (fn === 'resetStats') { stats = {delivered: 0, failed: 0, skipped: 0, distance: 0, time: 0, bestAvg: 0, longest: 0, streak: 0, bestStreak: 0, history: {}}; sendState() }
}
H.scenario = function (name) {
  let hud = {}
  if (name === 'idle') session = null
  else if (name === 'prep') session = Object.assign({}, baseSession, {phase: 'fading'})
  else {
    session = Object.assign({}, baseSession, {phase: 'driving'})
    hud = {phase: 'driving', elapsed: 74, total: 81, chronoState: 'running', distLeft: 1820, progress: 0.22, inZone: false, parkBrake: false, speedKmh: 52, validate: 0, near: false, inVehicle: true, validation: 'handbrake',
      odo: 940, avgKmh: 45.7, vmaxKmh: 88, resets: 1, damage: 420, switches: 0, pursuit: 0, stars: 0, policeOn: true, traffic: {active: true, amount: 12, parked: 6, police: 3}}
    if (name === 'start') { Object.assign(hud, {chronoState: 'wait', elapsed: 0, timeLeft: 182, speedKmh: 0, odo: 0}); session.timeLevelId = 'dur'; session.timeLevel = 'Difficile'; session.timeLimit = 182 }
    if (name === 'pursuit') { Object.assign(hud, {pursuit: 2, stars: 3, timeLeft: 83}); session.police = {mode: 'wanted', level: 3} }
    if (name === 'near') Object.assign(hud, {distLeft: 38, progress: 0.98, near: true, speedKmh: 12})
    if (name === 'inzone') Object.assign(hud, {distLeft: 1, progress: 1, near: true, inZone: true, speedKmh: 0})
    if (name === 'validating') Object.assign(hud, {distLeft: 1, progress: 1, near: true, inZone: true, speedKmh: 0, parkBrake: true, validate: 0.6})
    if (name === 'timelimit') Object.assign(hud, {timeLeft: 11, distLeft: 420, progress: 0.82}), session.timeLimit = 240
    if (name === 'summary') { session.phase = 'summary'; session.count = 5; session.summary = {ok: true, time: 182, dist: 2340, avg: 46.3, record: true, maxStars: 3, pursuitTime: 97, policeActive: true}; hud = {phase: 'summary'} }
    if (name === 'failed') { session.phase = 'failed'; session.summary = {ok: false, time: 240}; hud = {phase: 'failed'} }
    if (name === 'lost') { session.phase = 'lost'; session.message = 'Véhicule de livraison perdu. Choisis « Autre véhicule » ou « Passer ».'; hud = {phase: 'lost'} }
  }
  sendState()
  send('LivraisonLibreHud', hud)
}
H.summary = function (ok, preview) {
  send('LivraisonLibreSummary', {ok: ok, isPreview: !!preview, preview: '/car.png', reason: ok ? null : 'Arrêté par la police', count: 5, showFor: 5,
    vehicle: 'ETK 800-Series 856x Sport (M)', from: 'Parking', to: 'levels.west_coast_usa.gasStationPoints.apex.title',
    tripTime: 182, totalTime: 205, parkTime: ok ? 14 : null, plannedDist: 2340, tripDist: 2290, driven: 2410,
    avgKmh: 45.3, vmaxKmh: 96, resets: 2, damage: 1350, switches: 1, pursuits: 1, arrests: ok ? 0 : 1,
    records: ok ? {avg: true} : [], streak: ok ? 4 : 0, maxStars: ok ? 3 : 5, policeActive: true, pursuitTime: ok ? 97 : 151, timeLeft: ok ? 42 : null})
}
H.toast = function () { send('LivraisonLibreToast', {kind: 'err', msg: 'Aucune destination trouvée à cette distance. Élargis la distance min / max.'}) }
H.calls = calls
H.applyUrl = function () {
  const q = new URLSearchParams(location.search)
  if (q.get('view') === 'app') { document.getElementById('ctrl').style.display = 'none'; document.getElementById('resume').style.display = 'none' }
  if (q.get('view') === 'resume') { document.getElementById('ctrl').style.display = 'none'; document.getElementById('app').style.display = 'none' }
  if (q.get('view') === 'both') { document.getElementById('ctrl').style.display = 'none'; document.getElementById('wrap').style.alignItems = 'center'; document.body.style.justifyContent = 'center'; document.body.style.alignItems = 'center' }
  if (q.get('bg') === 'plain') document.body.style.background = 'transparent'
  if (q.get('scenario')) H.scenario(q.get('scenario'))
  if (q.get('tab')) {
    setTimeout(function () {
      const tabs = Array.prototype.slice.call(document.querySelectorAll('.ll-tab'))
      const t = tabs.find(function (b) { return b.textContent.trim().toLowerCase().indexOf(q.get('tab')) === 0 })
      if (t) t.click()
      if (q.get('open')) setTimeout(function () { document.querySelectorAll('details').forEach(function (d) { d.open = true }) }, 50)
      if (q.get('scroll')) setTimeout(function () { document.querySelector('.ll-body').scrollTop = +q.get('scroll') }, 120)
    }, 150)
  }
  if (q.get('summary')) H.summary(q.get('summary') === 'ok')
  if (q.get('vehicles')) H.handle('requestVehicles', [])
}
</script>
<script src="/ui/modules/apps/LivraisonLibre/app.js"></script>
<script src="/ui/modules/apps/LivraisonLibreResume/app.js"></script>
<script>
angular.element(document).ready(function () {
  angular.bootstrap(document.querySelector('#wrap'), ['beamng.apps'])
  setTimeout(H.applyUrl, 300)
})
</script>
</body>
</html>
